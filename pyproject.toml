[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-finder"
version = "0.1.0"
description = "Identify which past CIE exam paper a question came from"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
paper-finder = "paper_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_finder"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
