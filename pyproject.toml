[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-finder"
version = "0.1.0"
description = "Identify which past CIE exam paper a question came from"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
publish = [
    "psycopg[binary]>=3.1",  # paper-finder publish -> Supabase Postgres
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",  # required by fastapi.testclient.TestClient
    "psycopg[binary]>=3.1",
]

[project.scripts]
paper-finder = "paper_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_finder"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
