<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Finder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Paper Finder</h1>
    <p class="tagline">Find the CIE past paper a question came from.</p>
    <p id="corpus" class="corpus"></p>
  </header>

  <main>
    <section id="gate" hidden>
      <form id="email-form" autocomplete="off">
        <p>Enter your email and we&rsquo;ll send you a sign-in code.</p>
        <div class="gate-row">
          <input id="email" name="email" type="email" required
                 placeholder="you@example.com" autocomplete="email">
          <button id="send-code" type="submit">Send code</button>
        </div>
      </form>

      <form id="code-form" hidden autocomplete="off">
        <p>Enter the 6-digit code sent to <span id="code-email"></span>.</p>
        <div class="gate-row">
          <input id="code" name="code" inputmode="numeric" pattern="[0-9]*"
                 maxlength="6" required placeholder="123456" autocomplete="one-time-code">
          <button id="verify-code" type="submit">Verify</button>
        </div>
        <button id="code-back" type="button" class="linkbtn">Use a different email</button>
      </form>

      <p id="gate-status" role="status" aria-live="polite"></p>
    </section>

    <div id="app" hidden>
      <p id="whoami" class="whoami"></p>
      <form id="search" autocomplete="off">
        <input id="q" name="q" type="search" placeholder="A few words from the question&hellip;" autofocus>
        <button type="submit">Search</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ol id="results"></ol>
    </div>
  </main>

  <footer>
    <p id="footer-note">
      Past papers are &copy; Cambridge Assessment &mdash; for private study use,
      not redistribution.
    </p>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"
    integrity="sha384-EyR2P0dlmjnEGcm9xcjdAn0VedZpRHEwDLP9oSS6wYMvzHBHkUrvgonveazJ/sSx"
    crossorigin="anonymous"></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
